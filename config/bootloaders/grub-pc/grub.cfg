# GoConsoleOS GRUB Configuration
set timeout=10
set default=0

# GoConsoleOS theme colors
set color_normal=white/blue
set color_highlight=white/cyan

menuentry "GoConsoleOS - Gaming Mode" {
    linux /casper/vmlinuz boot=live hostname=gostudios username=gostudios quiet splash modeset
    initrd /casper/initrd
}

menuentry "GoConsoleOS - Desktop Mode" {
    linux /casper/vmlinuz boot=live hostname=gostudios username=gostudios quiet splash modeset gconsole_mode=desktop
    initrd /casper/initrd
}

menuentry "GoConsoleOS - Safe Graphics" {
    linux /casper/vmlinuz boot=live hostname=gostudios username=gostudios quiet splash nomodeset
    initrd /casper/initrd
}

menuentry "GoConsoleOS - OEM Install" {
    linux /casper/vmlinuz boot=live hostname=gostudios username=gostudios quiet splash oem-config/enable=true
    initrd /casper/initrd
}

menuentry "Memory Test" {
    linux /install/vmlinux
    initrd /install/initrd.gz
}
