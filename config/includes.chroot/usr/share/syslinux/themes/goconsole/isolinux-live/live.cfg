label goconsole
	menu label ^GoConsoleOS
	menu default
	kernel /casper/vmlinuz-6.8.0-146-generic
	append initrd=/casper/initrd.img-6.8.0-146-generic boot=casper config quiet splash

label goconsole-failsafe
	menu label GoConsoleOS (^safe graphics)
	kernel /casper/vmlinuz-6.8.0-146-generic
	append initrd=/casper/initrd.img-6.8.0-146-generic boot=casper config nomodeset

label goconsole-desktop
	menu label GoConsoleOS (^desktop mode)
	kernel /casper/vmlinuz-6.8.0-146-generic
	append initrd=/casper/initrd.img-6.8.0-146-generic boot=casper config gconsole_mode=desktop quiet splash
